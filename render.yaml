# Blueprint de Render: crea el servicio de la API a partir de este archivo.
# La base de datos NO se crea acá: está en Neon (ver docs/guia-de-despliegue.md).
services:
  - type: web
    name: tareaclara-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: con NODE_ENV=production npm omitiría TypeScript, que hace falta para compilar.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render genera una clave aleatoria larga y la guarda sin mostrarla en el repo
      - key: DATABASE_URL
        sync: false # se carga a mano en el panel de Render (es un secreto)
      - key: CORS_ORIGINS
        sync: false # la dirección de Netlify, por ejemplo https://tareaclara.netlify.app
